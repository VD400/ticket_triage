name: CI

on:
  push:
    branches: [main, feature/agent-supervisor]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: triage
          POSTGRES_DB: ticket_triage
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triage -d ticket_triage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://triage:ci-only-password@localhost:5432/ticket_triage
      ASYNC_DATABASE_URL: postgresql://triage:ci-only-password@localhost:5432/ticket_triage
      TEST_DATABASE_URL: postgresql+psycopg://triage:ci-only-password@localhost:5432/ticket_triage_test
      READONLY_DB_URL: postgresql+psycopg://triage:ci-only-password@localhost:5432/ticket_triage_test
      REDIS_URL: redis://localhost:6379/0
      # These values only initialize clients in offline tests. No provider calls.
      GROQ_API_KEY: test-key
      COHERE_API_KEY: test-key
      JWT_SECRET_KEY: ci-only-signing-key-never-use-in-production
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install PostgreSQL build headers
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install pinned Python
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Prepare application and test databases
        run: |
          uv run --frozen python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["ASYNC_DATABASE_URL"], autocommit=True) as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
              conn.execute("CREATE DATABASE ticket_triage_test")
          with psycopg.connect(
              "postgresql://triage:ci-only-password@localhost:5432/ticket_triage_test",
              autocommit=True,
          ) as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
          PY
      - name: Check migrations and checkpoint setup
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen python -m agent.setup_checkpointer
      - name: Run backend tests
        run: uv run --frozen pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:8000
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install browser for synchronization tests
        run: npx playwright install --with-deps chromium
      - name: Check dashboard synchronization
        run: npm run test:e2e
